<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご注文画面 (端末A)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 p-4 min-h-screen text-gray-800">
  <div class="max-w-lg mx-auto bg-white p-6 rounded-3xl shadow-lg border border-gray-200">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-3xl font-extrabold text-indigo-700">🛒 ご注文画面</h1>
      <span id="dev-tag" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-full">端末: A</span>
    </div>
    
    <!-- 焼きそば (已删去默认 checked) -->
    <div class="bg-amber-50 p-5 rounded-2xl mb-5 border-2 border-amber-200 shadow-sm">
      <div class="flex justify-between items-center font-bold text-2xl"><span>焼きそば</span><span class="text-amber-700">400円</span></div>
      <div class="mt-4 text-lg font-medium flex flex-wrap gap-3">
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-amber-300"><input type="checkbox" name="yakisoba" value="ウスター" class="w-6 h-6"><span>ウスター</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-amber-300"><input type="checkbox" name="yakisoba" value="ケチャップ" class="w-6 h-6"><span>ケチャップ</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-amber-300"><input type="checkbox" name="yakisoba" value="マヨネーズ" class="w-6 h-6"><span>マヨネーズ</span></label>
      </div>
      <button id="btn-yakisoba" onclick="addToCart('焼きそば', 400, 'yakisoba', 'btn-yakisoba')" class="mt-4 w-full bg-amber-500 text-white font-bold py-3 rounded-xl text-lg shadow-md transition">カートに追加</button>
    </div>

    <!-- フランクフルト (已删去默认 checked) -->
    <div class="bg-rose-50 p-5 rounded-2xl mb-5 border-2 border-rose-200 shadow-sm">
      <div class="flex justify-between items-center font-bold text-2xl"><span>フランクフルト</span><span class="text-rose-700">400円</span></div>
      <div class="mt-4 text-lg font-medium flex flex-wrap gap-3">
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-rose-300"><input type="checkbox" name="frank" value="ウスター" class="w-6 h-6"><span>ウスター</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-rose-300"><input type="checkbox" name="frank" value="ケチャップ" class="w-6 h-6"><span>ケチャップ</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-rose-300"><input type="checkbox" name="frank" value="マヨネーズ" class="w-6 h-6"><span>マヨネーズ</span></label>
      </div>
      <button id="btn-frank" onclick="addToCart('フランクフルト', 400, 'frank', 'btn-frank')" class="mt-4 w-full bg-rose-500 text-white font-bold py-3 rounded-xl text-lg shadow-md transition">カートに追加</button>
    </div>

    <!-- カップチュロス (已删去默认 checked) -->
    <div class="bg-orange-50 p-5 rounded-2xl mb-5 border-2 border-orange-200 shadow-sm">
      <div class="flex justify-between items-center font-bold text-2xl"><span>カップチュロス</span><span class="text-orange-700">300円</span></div>
      <div class="mt-4 text-lg font-medium flex flex-wrap gap-3">
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-orange-300"><input type="checkbox" name="churros" value="プレーン" class="w-6 h-6"><span>プレーン</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-orange-300"><input type="checkbox" name="churros" value="チョコ" class="w-6 h-6"><span>チョコ</span></label>
        <label class="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-orange-300"><input type="checkbox" name="churros" value="ジャム" class="w-6 h-6"><span>ジャム</span></label>
      </div>
      <button id="btn-churros" onclick="addToCart('カップチュロス', 300, 'churros', 'btn-churros')" class="mt-4 w-full bg-orange-500 text-white font-bold py-3 rounded-xl text-lg shadow-md transition">カートに追加</button>
    </div>

    <!-- 结算区 -->
    <div class="border-t-2 pt-5">
      <h2 class="font-bold text-gray-800 text-xl mb-3">選択中の商品：</h2>
      <ul id="cart-list" class="text-base bg-gray-50 p-4 rounded-xl border min-h-[70px] space-y-2 font-medium"></ul>
      
      <!-- 割引適用チェックボックス -->
      <div class="mt-4 bg-purple-50 p-3 rounded-xl border border-purple-200">
        <label class="flex items-center space-x-3 cursor-pointer">
          <input type="checkbox" id="discount-checkbox" class="w-6 h-6 text-purple-600 rounded">
          <span class="font-bold text-purple-900 text-lg">🎁 割引適用 (この注文にマーク)</span>
        </label>
      </div>

      <div class="flex justify-between items-center mt-4 text-2xl font-bold">
        <span>合計金額：</span>
        <span class="text-red-600 text-3xl"><span id="total-price">0</span> 円</span>
      </div>
      
      <div class="flex space-x-3 mt-5">
        <button onclick="clearCart()" class="w-1/3 bg-gray-300 hover:bg-gray-400 active:scale-95 text-gray-800 font-bold py-3 rounded-2xl text-lg transition">取り消し</button>
        <button id="submit-btn" onclick="submitOrder()" class="w-2/3 bg-green-500 hover:bg-green-600 active:scale-95 text-white font-bold py-3 rounded-2xl text-xl shadow-lg transition">注文確定</button>
      </div>
    </div>
  </div>

  <script>
    const DEVICE_ID = "A"; // 端末B请改为 "B"
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbymx0h8nGaF4vgOb35kTQvCBFhjcmXG6gFbPGcNjIC8txVs3Rhe5K1IulB7OJOToo6NrQ/exec";

    let cart = []; 
    let total = 0;

    function addToCart(name, price, checkboxName, btnId) {
      const btn = document.getElementById(btnId);
      
      if (btn.disabled) return;
      btn.disabled = true;

      const checkedBoxes = Array.from(document.querySelectorAll(`input[name="${checkboxName}"]:checked`));
      const selectedSauces = checkedBoxes.map(cb => cb.value);
      const sauceText = selectedSauces.length > 0 ? selectedSauces.join('・') : 'ソースなし';

      cart.push({ name, price, sauce: sauceText }); 
      total += price; 
      renderCart();

      const originalBg = btn.className;
      btn.className = "mt-4 w-full bg-green-600 text-white font-bold py-3 rounded-xl text-lg shadow-lg scale-95 transition-all duration-150 cursor-not-allowed opacity-80";
      btn.innerText = "✨ 追加しました！";

      setTimeout(() => {
        btn.className = originalBg;
        btn.innerText = "カートに追加";
        btn.disabled = false; 
      }, 800);
    }

    function removeItem(idx) { 
      total -= cart[idx].price; 
      cart.splice(idx, 1); 
      renderCart(); 
    }

    async function submitOrder() {
      if (cart.length === 0) return alert('商品を選択してください。');

      const isDiscounted = document.getElementById('discount-checkbox').checked;
      let counterKey = `order_counter_${DEVICE_ID}`;
      let currentSeq = parseInt(localStorage.getItem(counterKey) || "0") + 1;
      if (currentSeq > 999) currentSeq = 1; 
      localStorage.setItem(counterKey, currentSeq);

      const orderNumStr = `#${DEVICE_ID}-${currentSeq}`;

      let confirmMsg = `注文 ${orderNumStr}（合計 ${total}円`;
      if (isDiscounted) confirmMsg += ` 【割引適用】`;
      confirmMsg += `）を確定しますか？`;

      if (!confirm(confirmMsg)) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "送信中...";
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const newOrder = { 
        id: Date.now(), 
        num: orderNumStr, 
        time: timeStr, 
        items: [...cart], 
        total: total,
        isDiscounted: isDiscounted,
        status: 'pending'
      };

      try {
        await fetch(GOOGLE_API_URL, { 
          method: 'POST', 
          mode: 'no-cors', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(newOrder) 
        });
      } catch (err) {
        console.error('送信エラー:', err);
      }

      alert(`注文 ${orderNumStr} を受付けました！`); 
      clearCart();

      btn.disabled = false;
      btn.innerText = "注文確定";
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    // 清空购物车与清空所有复选框
    function clearCart() { 
      cart = []; 
      total = 0; 
      document.getElementById('discount-checkbox').checked = false;
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
      });
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      if (cart.length === 0) { 
        list.innerHTML = '<span class="text-gray-400 text-lg">選択されていません</span>'; 
      } else { 
        list.innerHTML = cart.map((i, idx) => `
          <li class="flex justify-between items-center border-b pb-1">
            <span>・<b>${i.name}</b>（${i.sauce}）</span>
            <span class="font-bold">${i.price}円 <button onclick="removeItem(${idx})" class="text-red-500 font-bold ml-2 text-xl px-1">✕</button></span>
          </li>
        `).join(''); 
      }
      document.getElementById('total-price').innerText = total;
    }

    clearCart();
  </script>
</body>
</html>
