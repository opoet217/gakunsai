<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨房・注文管理モニター</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen text-gray-800">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow border">
      <div>
        <h1 class="text-2xl font-extrabold text-indigo-700">👨‍🍳 注文進行状況モニター</h1>
        <p class="text-xs text-gray-500 mt-1">未完了の注文：<span id="pending-count" class="font-bold text-red-500 text-lg">0</span> 件</p>
      </div>
      <button onclick="fetchOrders()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold px-4 py-2 rounded-xl shadow transition">
        🔄 更新
      </button>
    </div>

    <div id="order-list" class="space-y-4">
      <div class="text-center text-gray-400 py-10 font-bold text-lg">データを読み込み中...</div>
    </div>
  </div>

  <script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwRx0me0hiXD56P6N_yc0eiZ5C0EQqfdxho6E-1ZM9dZb407HtG2-SgXlPnhZU16I_9GQ/exec";
    let previousPendingCount = 0;

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) { console.log('Audio disabled'); }
    }

    async function fetchOrders() {
      try {
        const res = await fetch(GOOGLE_API_URL);
        const data = await res.json();
        renderOrders(data);
      } catch (err) {
        console.error('取得エラー:', err);
      }
    }

    function renderOrders(rawList) {
      const container = document.getElementById('order-list');
      
      const groupedOrders = {};
      rawList.forEach(item => {
        if (!groupedOrders[item.num]) {
          groupedOrders[item.num] = {
            num: item.num,
            time: item.time,
            status: item.status || 'pending',
            items: []
          };
        }
        groupedOrders[item.num].items.push(item);
      });

      const orderArray = Object.values(groupedOrders);
      orderArray.sort((a, b) => (a.status === 'done' ? 1 : -1));

      const pendingOrders = orderArray.filter(o => o.status !== 'done');
      
      if (pendingOrders.length > previousPendingCount && previousPendingCount !== 0) {
        playBeep();
      }
      previousPendingCount = pendingOrders.length;

      document.getElementById('pending-count').innerText = pendingOrders.length;

      if (orderArray.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-10 font-bold text-lg">現在注文はありません 🎉</div>';
        return;
      }

      container.innerHTML = orderArray.map(o => {
        const isDone = o.status === 'done';
        const cardBg = isDone ? 'bg-gray-200 border-gray-300 opacity-60' : 'bg-white border-amber-400 shadow-md';
        const badgeBg = isDone ? 'bg-gray-500' : 'bg-amber-500';
        const statusText = isDone ? '完了済' : '調理中';

        const itemListHtml = o.items.map(i => `
          <div class="flex justify-between items-center border-b pb-1 text-lg">
            <span class="font-bold text-gray-800">・${i.name}</span>
            <span class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-200">${i.sauce}</span>
          </div>
        `).join('');

        return `
          <div class="p-5 rounded-2xl border-2 ${cardBg} transition">
            <div class="flex justify-between items-center mb-3">
              <div class="flex items-center space-x-3">
                <span class="text-2xl font-black text-gray-900">${o.num}</span>
                <span class="text-xs text-gray-500 font-medium">${o.time}</span>
              </div>
              <span class="${badgeBg} text-white font-bold text-xs px-3 py-1 rounded-full">${statusText}</span>
            </div>
            
            <div class="space-y-2 mb-4">
              ${itemListHtml}
            </div>

            ${!isDone ? `
              <button onclick="markAsDone('${o.num}')" class="w-full bg-green-500 hover:bg-green-600 active:scale-95 text-white font-bold py-3 rounded-xl text-lg shadow-md transition">
                ✅ 調理完了（提供済みにする）
              </button>
            ` : `
              <div class="text-center text-sm font-bold text-gray-500 py-1">この注文は提供済みです</div>
            `}
          </div>
        `;
      }).join('');
    }

    async function markAsDone(orderNum) {
      if (!confirm(`注文 ${orderNum} を「完了」にしますか？`)) return;

      try {
        await fetch(GOOGLE_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'updateStatus', num: orderNum, status: 'done' })
        });
        setTimeout(fetchOrders, 500);
      } catch (err) {
        alert('状态更新失败: ' + err);
      }
    }

    setInterval(fetchOrders, 10000);
    fetchOrders();
  </script>
</body>
</html>
